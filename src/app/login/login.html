<div class="login-container">

  <div class="login-card">

    <div class="logo">
      STANDARD BANK
    </div>

    <h1>Personal & Private Banking</h1>
    <p class="subtitle">Sign in to your account</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit">
        Sign In
      </button>

    </form>

  </div>

</div>
